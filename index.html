<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello Abhi</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4a90e2, #50e3c2);
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 3rem 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 3rem;
    }
    p {
      margin: 0;
      font-size: 1.2rem;
      opacity: 0.9;
    }
    .button {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.9rem 1.8rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.22);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.32);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Abhi!</h1>
    <p>Welcome to your simple website.</p>
    <a class="button" href="https://instagram.com/abhimachhal" target="_blank" rel="noopener noreferrer">Open Instagram</a>
  </div>
</body>
</html>
